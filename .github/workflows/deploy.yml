# Workflow 2 — Auto-deploy to GitHub Pages
# Every push to main (normally a merged pull request) publishes the site to
# https://<username>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run a deployment manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; never cancel one that is already running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
